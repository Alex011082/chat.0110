name: chat-paths

# Ветка чата не должна менять код продукта. До миграции ещё допустим chats/.
on:
  pull_request:

jobs:
  paths:
    if: startsWith(github.head_ref, 'chat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Только Chat и прежний chats
        run: |
          set -euo pipefail
          bad=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | awk '
            $0 ~ /^Chat\// { next }
            $0 ~ /^chats\// { next }
            { print }
          ')
          if [ -n "$bad" ]; then
            echo "Ветка чата меняет файлы вне Chat/ и chats/:"
            echo "$bad"
            exit 1
          fi
