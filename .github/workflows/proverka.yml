name: proverka

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proverka:
    # Чаты — тоже PR в main, но кода в них нет: проверять там нечего.
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'chat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Проверка раздаваемого remote-плагина
        run: python3 scripts/check-remote-plugin.py apps/web/dist/downloads candidate-artifacts/remote-plugin
      - name: Скрипты выката
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Совместимый артефакт отката и проверка очереди
        timeout-minutes: 5
        env:
          CHAT0110_ROLLBACK_FRONTEND_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHAT0110_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$CHAT0110_ROLLBACK_FRONTEND_REF" =~ ^[a-f0-9]{40}$ ]]
          git fetch --depth=1 origin "$CHAT0110_ROLLBACK_FRONTEND_REF"
          git fetch --depth=1 origin b690559660c4e3920e2a21dac35c8982b1801e13
          bun scripts/build-rollback-artifact.ts "$CHAT0110_ROLLBACK_FRONTEND_REF" artifacts
          bun scripts/check-rollback-artifact.ts artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: chat0110-rollback-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chat0110-remote-plugin-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-artifacts/remote-plugin/
          retention-days: 7
          if-no-files-found: error
