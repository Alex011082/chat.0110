name: review-video

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/demo/**'
      - '.github/workflows/review-video.yml'

permissions:
  contents: read

jobs:
  recording:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref, 'chat/')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/demo/replay.test.ts
      - run: bunx tsc -p scripts/demo/tsconfig.json --noEmit
      - run: bun run build
      - name: Инструменты записи только на одноразовом runner
        run: |
          npm install --prefix "$RUNNER_TEMP/chat0110-playwright" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/chat0110-playwright/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Исторический replay без внешней сети и записей
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/chat0110-playwright/node_modules/playwright/index.mjs
          CHAT0110_RECORDING_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/demo/record.ts
      - name: Проверка готового набора
        run: |
          cd artifacts/review-video
          sha256sum -c SHA256SUMS
          cp ../../scripts/demo/pr206-sources.json .
      - uses: actions/upload-artifact@v4
        with:
          name: chat0110-review-video-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/review-video/*.mp4
            artifacts/review-video/poster.png
            artifacts/review-video/receipt.json
            artifacts/review-video/SHA256SUMS
            artifacts/review-video/pr206-sources.json
          if-no-files-found: error
          retention-days: 30
